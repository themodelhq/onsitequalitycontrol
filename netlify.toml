[build]
  base = "."
  command = "npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && pnpm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API calls proxy to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-APP.onrender.com/api/:splat"
  status = 200
  force = true

[context.production]
  command = "npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && pnpm run build:client"

[context.deploy-preview]
  command = "npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && pnpm run build:client"
