[build]
  base = "."
  command = "pnpm install --no-frozen-lockfile && pnpm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# ─── IMPORTANT ────────────────────────────────────────────────────────────────
# Replace YOUR-RENDER-APP below with your actual Render service name.
# Example: if your Render URL is https://jumia-qa.onrender.com
# then change it to:  https://jumia-qa.onrender.com/api/:splat
#
# The API redirect MUST come before the SPA catch-all or Netlify
# will serve index.html for every /api/* request.
# ──────────────────────────────────────────────────────────────────────────────

# API calls proxy to Render backend — MUST be listed before the SPA redirect
[[redirects]]
  from = "/api/*"
  to = "https://onsitequalitycontrol.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing — all non-API, non-asset routes fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm install --no-frozen-lockfile && pnpm run build:client"

[context.deploy-preview]
  command = "pnpm install --no-frozen-lockfile && pnpm run build:client"
