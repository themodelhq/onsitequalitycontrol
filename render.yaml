services:
  # Backend Web Service
  - type: web
    name: jumia-quality-analyzer-api
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false  # Your Netlify frontend URL
    healthCheckPath: /api/health
    autoDeploy: true

  # Optional: If you want a managed PostgreSQL instead of MySQL
  # databases:
  #   - name: jumia-db
  #     databaseName: jumia_quality
  #     user: jumia
