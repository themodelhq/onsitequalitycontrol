services:
  - type: web
    name: jumia-quality-analyzer-api
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        value: 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
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_ENDPOINT
        value: https://pivpvwqynlbdcjryuzwy.storage.supabase.co/storage/v1/s3
      - key: STORAGE_REGION
        value: eu-west-1
      - key: STORAGE_BUCKET
        value: hostimage
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
